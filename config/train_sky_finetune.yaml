# New fine-tuning run: --init_checkpoint <old_run>/checkpoint/iter_021000.
# Use --resume_run only to resume this NEW run with its saved configuration.
base_config:
- config/train_apdepth.yaml

lr: 5.0e-06
max_iter: 6000
lr_scheduler:
  kwargs:
    total_iter: 6000
    final_ratio: 0.1
    warmup_steps: 100

far_depth_supervision:
  enabled: true
  weight: 0.5

trainer:
  backup_period: 1000
